
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | TaskFlow</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #292643;
        }

        .signup-card {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(45, 35, 90, 0.12);
        }

        .logo {
            color: #6c5ce7;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #85839a;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dedcea;
            border-radius: 9px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        input:focus {
            outline: 2px solid #d8d0ff;
            border-color: #6c5ce7;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #6c5ce7;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5745d0;
        }

        #message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
        }

        #message.error {
            display: block;
            background: #fff0f0;
            color: #b42323;
        }

        #message.success {
            display: block;
            background: #eafaf0;
            color: #217747;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            font-size: 13px;
            color: #85839a;
        }

        a {
            color: #6c5ce7;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="signup-card">
        <div class="logo">TaskFlow</div>

        <h1>Create your account</h1>
        <p class="subtitle">
            Sign up to start organizing your tasks and projects.
        </p>

        <form id="signupForm">
            <label for="name">Full name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email address</label>
            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                minlength="6"
                required
            >

            <button type="submit">Create Account</button>
            <div id="message" role="status"></div>
        </form>

        <p class="footer">
            Already have an account?
            <a href="login.html">Log in</a>
        </p>
    </main>

    <script>
        const signupForm = document.getElementById("signupForm");
        const message = document.getElementById("message");

        signupForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;

            if (!name || !email || password.length < 6) {
                message.textContent = "Enter your details and use a password with at least 6 characters.";
                message.className = "error";
                return;
            }

            let users = [];

            try {
                users = JSON.parse(localStorage.getItem("taskflow_users") || "[]");
            } catch (error) {
                users = [];
            }

            if (!Array.isArray(users)) {
                users = [];
            }

            const exists = users.some(function (user) {
                return user.email &&
                    user.email.toLowerCase() === email;
            });

            if (exists) {
                message.textContent = "An account with this email already exists. Please log in.";
                message.className = "error";
                return;
            }

            users.push({
                name: name,
                email: email,
                password: password
            });

            localStorage.setItem("taskflow_users", JSON.stringify(users));

            message.textContent = "Account created! Redirecting to login...";
            message.className = "success";

            signupForm.reset();

            setTimeout(function () {
                window.location.href = "login.html";
            }, 1000);
        });
    </script>
</body>
</html>
