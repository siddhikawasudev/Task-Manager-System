
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar | TaskFlow</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fc;
            color: #252442;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            background: #fff;
            padding: 28px 18px;
            border-right: 1px solid #e8e8f1;
            flex-shrink: 0;
        }

        .logo {
            color: #6c4cf1;
            font-size: 27px;
            margin: 0 0 35px 10px;
        }

        .nav-link {
            display: block;
            text-decoration: none;
            color: #686880;
            padding: 13px 14px;
            margin-bottom: 8px;
            border-radius: 10px;
            font-size: 15px;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #eee9ff;
            color: #6c4cf1;
            font-weight: bold;
        }

        .main {
            flex: 1;
            min-width: 0;
            padding: 32px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .topbar h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .subtitle {
            color: #85859a;
            font-size: 14px;
        }

        .user {
            background: white;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #e8e8f1;
        }

        .calendar-card {
            background: white;
            padding: 24px;
            border-radius: 18px;
            border: 1px solid #ececf4;
            box-shadow: 0 5px 20px rgba(35, 30, 80, 0.04);
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .calendar-header h2 {
            font-size: 22px;
        }

        .calendar-actions {
            display: flex;
            gap: 8px;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 9px;
            padding: 10px 14px;
            font-size: 14px;
        }

        .secondary-btn {
            background: #f0edff;
            color: #6545e8;
        }

        .secondary-btn:hover {
            background: #e4ddff;
        }

        .primary-btn {
            background: #6c4cf1;
            color: white;
        }

        .primary-btn:hover {
            background: #5638d5;
        }

        .weekdays,
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }

        .weekdays {
            border-bottom: 1px solid #ededf4;
            padding-bottom: 12px;
        }

        .weekday {
            text-align: center;
            color: #88889c;
            font-size: 12px;
            font-weight: bold;
        }

        .day {
            min-height: 115px;
            padding: 9px 6px;
            border-right: 1px solid #f0f0f6;
            border-bottom: 1px solid #f0f0f6;
            overflow-wrap: anywhere;
        }

        .day:nth-child(7n) {
            border-right: none;
        }

        .day.empty {
            background: #fafaff;
        }

        .day-number {
            display: inline-flex;
            width: 28px;
            height: 28px;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .today .day-number {
            background: #6c4cf1;
            color: white;
            font-weight: bold;
        }

        .task-item {
            display: block;
            margin: 3px 0;
            padding: 5px 6px;
            border-radius: 5px;
            background: #eee9ff;
            color: #6042dc;
            font-size: 11px;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }

        .task-item.completed {
            background: #e4f8ec;
            color: #21834c;
            text-decoration: line-through;
        }

        .task-item.high {
            border-left: 3px solid #ef6262;
        }

        .task-item.medium {
            border-left: 3px solid #e8a12d;
        }

        .task-item.low {
            border-left: 3px solid #36a879;
        }

        .no-date-note {
            margin-top: 20px;
            color: #85859a;
            font-size: 13px;
        }

        .empty-message {
            padding: 30px 10px;
            text-align: center;
            color: #85859a;
            display: none;
        }

        @media (max-width: 800px) {
            .sidebar {
                width: 185px;
                padding: 20px 10px;
            }

            .main {
                padding: 20px 12px;
            }

            .calendar-card {
                padding: 12px;
                overflow-x: auto;
            }

            .weekdays,
            .calendar-grid {
                min-width: 550px;
            }

            .day {
                min-height: 95px;
            }
        }

        @media (max-width: 520px) {
            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;
                padding: 15px;
            }

            .logo {
                margin-bottom: 15px;
            }

            .sidebar nav {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
            }

            .nav-link {
                padding: 9px;
                margin: 0;
                font-size: 13px;
            }

            .main {
                padding: 16px 10px;
            }
        }
    </style>
</head>

<body>
<div class="layout">

    <aside class="sidebar">
        <h2 class="logo">TaskFlow</h2>

        <nav>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="task.html" class="nav-link">My Tasks</a>
            <a href="projects.html" class="nav-link">Projects</a>
            <a href="calender.html" class="nav-link active">Calendar</a>
            <a href="settings.html" class="nav-link">Settings</a>
        </nav>
    </aside>

    <main class="main">
        <div class="topbar">
            <div>
                <h1>Calendar</h1>
                <p class="subtitle">See your tasks and their due dates.</p>
            </div>

            <div class="user">
                👤 <span id="userName">User</span>
            </div>
        </div>

        <section class="calendar-card">
            <div class="calendar-header">
                <h2 id="monthTitle">Month Year</h2>

                <div class="calendar-actions">
                    <button class="secondary-btn" id="previousMonth">←</button>
                    <button class="secondary-btn" id="todayButton">Today</button>
                    <button class="secondary-btn" id="nextMonth">→</button>
                </div>
            </div>

            <div class="weekdays">
                <div class="weekday">Sun</div>
                <div class="weekday">Mon</div>
                <div class="weekday">Tue</div>
                <div class="weekday">Wed</div>
                <div class="weekday">Thu</div>
                <div class="weekday">Fri</div>
                <div class="weekday">Sat</div>
            </div>

            <div class="calendar-grid" id="calendarGrid"></div>

            <p class="no-date-note">
                Tasks appear on their due dates. Add a due date when creating a task.
            </p>

            <div class="empty-message" id="emptyMessage">
                No tasks with due dates this month.
            </div>
        </section>
    </main>
</div>

<script>
    // Show the logged-in user's name
    const currentUser = JSON.parse(
        localStorage.getItem("taskflow_current_user") || "null"
    );

    if (currentUser) {
        document.getElementById("userName").textContent =
            currentUser.name || currentUser.email || "User";
    }

    // Calendar state
    let displayedDate = new Date();
    displayedDate.setDate(1);

    const calendarGrid = document.getElementById("calendarGrid");
    const monthTitle = document.getElementById("monthTitle");
    const emptyMessage = document.getElementById("emptyMessage");

    function getSavedTasks() {
        try {
            const tasks = JSON.parse(
                localStorage.getItem("taskflow_tasks") || "[]"
            );

            return Array.isArray(tasks) ? tasks : [];
        } catch (error) {
            return [];
        }
    }

    function renderCalendar() {
        calendarGrid.innerHTML = "";

        const year = displayedDate.getFullYear();
        const month = displayedDate.getMonth();

        monthTitle.textContent = displayedDate.toLocaleDateString(
            "en-US",
            { month: "long", year: "numeric" }
        );

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const tasks = getSavedTasks();
        const today = new Date();
        let tasksShown = 0;

        // Empty cells before the first day of the month
        for (let i = 0; i < firstDay; i++) {
            const emptyCell = document.createElement("div");
            emptyCell.className = "day empty";
            calendarGrid.appendChild(emptyCell);
        }

        // Create each day
        for (let day = 1; day <= daysInMonth; day++) {
            const cell = document.createElement("div");
            cell.className = "day";

            const isToday =
                day === today.getDate() &&
                month === today.getMonth() &&
                year === today.getFullYear();

            if (isToday) {
                cell.classList.add("today");
            }

            const number = document.createElement("div");
            number.className = "day-number";
            number.textContent = day;
            cell.appendChild(number);

            const dateKey = [
                year,
                String(month + 1).padStart(2, "0"),
                String(day).padStart(2, "0")
            ].join("-");

            // Match tasks to their due date
            const matchingTasks = tasks.filter(task => {
                const dueDate = task.dueDate || task.due_date || task.date;

                if (!dueDate) return false;

                // Compare YYYY-MM-DD values without timezone changes
                return String(dueDate).slice(0, 10) === dateKey;
            });

            matchingTasks.forEach(task => {
                const taskElement = document.createElement("div");
                taskElement.className = "task-item";

                const priority = String(task.priority || "").toLowerCase();

                if (["high", "medium", "low"].includes(priority)) {
                    taskElement.classList.add(priority);
                }

                if (
                    task.completed === true ||
                    task.isCompleted === true ||
                    task.status === "Completed"
                ) {
                    taskElement.classList.add("completed");
                }

                // Support common task title field names
                taskElement.textContent =
                    task.title || task.name || task.text || task.task || "Untitled task";

                taskElement.title = taskElement.textContent;
                cell.appendChild(taskElement);
                tasksShown++;
            });

            calendarGrid.appendChild(cell);
        }

        emptyMessage.style.display = tasksShown === 0 ? "block" : "none";
    }

    document.getElementById("previousMonth").addEventListener("click", () => {
        displayedDate.setMonth(displayedDate.getMonth() - 1);
        renderCalendar();
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
        displayedDate.setMonth(displayedDate.getMonth() + 1);
        renderCalendar();
    });

    document.getElementById("todayButton").addEventListener("click", () => {
        displayedDate = new Date();
        displayedDate.setDate(1);
        renderCalendar();
    });

    renderCalendar();
</script>
</body>
</html>
